
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figgy Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:20px;background:#090510;color:white;
 font-family:'Outfit',sans-serif;overflow:hidden;
 background-image:radial-gradient(ellipse at 20% 10%,#35145d 0,transparent 40%),radial-gradient(ellipse at 90% 90%,#271044 0,transparent 40%);
}
#particles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.card{
 position:relative;width:min(100%,540px);padding:35px 25px;
 border-radius:28px;text-align:center;
 background:linear-gradient(145deg,#211331ed,#100a1bed);
 border:1px solid #9c65d755;
 box-shadow:0 0 60px #8c39ff22;
 animation:appear .8s ease both;
}
.logo{
 width:100px;height:100px;margin:auto auto 20px;
 display:grid;place-items:center;border-radius:30px;
 background:linear-gradient(145deg,#52218b,#251039);
 border:1px solid #c18aff77;
 box-shadow:0 0 35px #a34dff66;
 animation:float 3s ease-in-out infinite;
}
.logo svg{width:72px;filter:drop-shadow(0 0 12px #c28aff)}
h1{
 margin:0;font-size:48px;font-weight:900;letter-spacing:-2px;
 background:linear-gradient(90deg,#fff,#c58aff,#9c5bff,#fff);
 background-size:300%;color:transparent;background-clip:text;
 animation:gradient 5s linear infinite;
}
.subtitle{color:#a99bb9;font-size:14px;margin:10px 0 30px}
.label{
 display:flex;justify-content:space-between;
 color:#d9c5ef;font-size:12px;font-weight:700;
 letter-spacing:1.5px;margin:0 3px 12px;
}
.ready{color:#c18aff}
.key-menu{
 position:relative;padding:2px;border-radius:19px;
 isolation:isolate;overflow:hidden;
 background:linear-gradient(90deg,#7532d7,#e5aaff,#7431dc,#b56cff);
 background-size:400%;
 animation:border 4s linear infinite,glow 2s ease-in-out infinite;
}
.key-menu:before{
 content:"";position:absolute;inset:-100%;z-index:-1;
 background:conic-gradient(transparent 65%,white 70%,#c58aff 74%,transparent 80%);
 animation:spin 3s linear infinite;
}
.key-menu:after{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(110deg,transparent,#ffffff22,transparent);
 background-size:200%;animation:shine 2.5s infinite;
}
.key-inner{
 position:relative;z-index:1;display:flex;align-items:center;
 gap:12px;padding:15px;background:#170e25;
 border-radius:17px;overflow:hidden;
}
.key-inner:before{
 content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;
 background:linear-gradient(90deg,transparent,#b87aff33,transparent);
 transform:skewX(-20deg);animation:slide 3s infinite;
}
.key-icon{
 position:relative;z-index:2;flex-shrink:0;
 width:42px;height:42px;border-radius:13px;
 display:grid;place-items:center;
 background:#8d4bdc33;color:#e2c4ff;
 border:1px solid #c18aff66;
 animation:iconGlow 2s infinite;
}
.key-copy{flex:1;min-width:0;text-align:left;z-index:2}
.key-caption{display:block;color:#a995bc;font-size:10px;letter-spacing:1.5px;margin-bottom:5px}
.key-value{font-size:13px;font-weight:600;overflow-wrap:anywhere;color:#f1e5ff}
.copy{
 position:relative;z-index:3;border:0;border-radius:12px;
 padding:13px 16px;background:linear-gradient(120deg,#9148e9,#c28aff);
 color:white;font-family:inherit;font-weight:900;
 letter-spacing:1px;cursor:pointer;overflow:hidden;transition:.25s;
}
.copy:hover{transform:translateY(-3px);box-shadow:0 0 25px #a65cff88}
.copy:active{transform:scale(.94)}
.copy:before{
 content:"";position:absolute;top:-20%;left:-80%;
 width:45%;height:150%;background:#ffffff55;
 transform:skewX(-25deg);transition:.5s;
}
.copy:hover:before{left:150%}
.status{height:25px;margin-top:12px;color:#d0a5ff;font-size:12px}
.divider{height:1px;background:linear-gradient(90deg,transparent,#a96aff66,transparent);margin:20px 0}
.footer{font-size:10px;letter-spacing:3px;color:#78678d}
.footer span{color:#c28aff}
@keyframes appear{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes gradient{to{background-position:300%}}
@keyframes border{to{background-position:400%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:0 0 35px #a34dff99}}
@keyframes shine{0%{background-position:200%}100%{background-position:-200%}}
@keyframes slide{0%,15%{left:-40%}75%,100%{left:140%}}
@keyframes iconGlow{50%{box-shadow:0 0 22px #ae68ff99;transform:translateY(-3px)}}
@media(max-width:450px){
 .card{padding:27px 15px}
 h1{font-size:42px}
 .key-inner{gap:8px;padding:11px}
 .copy{padding:12px 10px;font-size:11px}
 .key-value{font-size:11px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<main class="card">
 <div class="logo">
  <svg viewBox="0 0 100 110" fill="none">
   <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
     <stop stop-color="#f2ddff"/>
     <stop offset=".5" stop-color="#bd83ff"/>
     <stop offset="1" stop-color="#7130b8"/>
    </linearGradient>
   </defs>
   <path d="M48 25C43 13 49 6 57 3C53 14 60 19 57 27" stroke="#d7b4ff" stroke-width="6" stroke-linecap="round"/>
   <path d="M50 24C38 29 27 29 21 44C11 69 27 94 44 100C49 103 55 103 60 100C78 93 90 68 79 44C73 29 61 29 50 24Z" fill="url(#g)" stroke="#ead7ff" stroke-width="1.5"/>
   <path d="M49 29C42 50 45 78 50 99M33 37C25 57 32 81 44 94M67 37C77 57 68 82 57 94" stroke="#f3e3ff" stroke-opacity=".55" stroke-width="2"/>
  </svg>
 </div>

 <h1>Figgy Hub</h1>
 <p class="subtitle">Your key is ready. Copy it and enjoy!</p>

 <div class="label">
  <span>YOUR ACCESS KEY</span>
  <span class="ready">● READY</span>
 </div>

 <div class="key-menu">
  <div class="key-inner">
   <div class="key-icon">
    <svg width="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
     <circle cx="8" cy="15" r="4"/>
     <path d="m11 12 8-8 2 2-2 2 2 2-3 3-2-2-2 2"/>
    </svg>
   </div>
   <div class="key-copy">
    <span class="key-caption">FIGGY HUB KEY</span>
    <span class="key-value" id="keyText">FiggyHubKeyLajwkwop - KalownwlsihLwpwiwb</span>
   </div>
   <button class="copy" id="copyBtn" type="button">COPY</button>
  </div>
 </div>

 <div class="status" id="status" aria-live="polite"></div>
 <div class="divider"></div>
 <div class="footer">POWERED BY <span>FIGGY HUB</span></div>
</main>

<script>
const KEY = "FiggyHubKeyLajwkwop - KalownwlsihLwpwiwb";
const button = document.getElementById("copyBtn");
const status = document.getElementById("status");

async function copyKey(){
 if(navigator.clipboard && window.isSecureContext){
  await navigator.clipboard.writeText(KEY);
  return true;
 }
 const area = document.createElement("textarea");
 area.value = KEY;
 area.readOnly = true;
 area.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0;font-size:16px";
 document.body.appendChild(area);
 area.focus();
 area.select();
 area.setSelectionRange(0,KEY.length);
 let success = false;
 try{success = document.execCommand("copy")}catch(e){success=false}
 area.remove();
 return success;
}

button.addEventListener("click",async()=>{
 button.disabled=true;
 status.textContent="Copying your key...";
 try{
  const success=await copyKey();
  if(!success) throw new Error("Copy failed");
  button.textContent="✓ COPIED";
  status.textContent="Your key has been copied successfully!";
 }catch(e){
  status.textContent="Copy was blocked. Please press and hold the key to copy it manually.";
 }finally{
  button.disabled=false;
 }
 setTimeout(()=>button.textContent="COPY",2200);
});

const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
let particles=[],w,h,dpr;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 w=innerWidth;h=innerHeight;
 canvas.width=w*dpr;canvas.height=h*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 particles=Array.from({length:65},()=>({
  x:Math.random()*w,y:Math.random()*h,
  r:Math.random()*1.5+.4,
  speed:Math.random()*.35+.08,
  phase:Math.random()*6.28
 }));
}
function animate(){
 ctx.clearRect(0,0,w,h);
 for(const p of particles){
  p.y-=p.speed;
  p.x+=Math.sin(Date.now()*.0007+p.phase)*.2;
  if(p.y<0){p.y=h;p.x=Math.random()*w}
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle="rgba(201,155,255,.65)";
  ctx.shadowBlur=9;
  ctx.shadowColor="#a65cff";
  ctx.fill();
 }
 ctx.shadowBlur=0;
 requestAnimationFrame(animate);
}
addEventListener("resize",resize);
resize();
animate();
</script>
</body>
</html>
